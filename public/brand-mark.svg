<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none">
  <!-- TDH Monogram Mark -->
  <g transform="translate(10, 8)">
    <!-- T top bar extending across to D -->
    <path d="M0 16 H44 V26 H26 V56 H14 V26 H0 Z" fill="#9D4EDD"/>
    
    <!-- Crown atop the D -->
    <path d="M30 4 L34 11 L39 4 L44 11 L48 4 L47 14 H31 Z" fill="#D6B36A"/>
    
    <!-- D outer curve -->
    <path d="M22 16 H44 C56 16 64 24 64 36 C64 48 56 56 44 56 H22 Z" fill="#7B2CBF"/>
    
    <!-- Chat bubble inside the D -->
    <path d="M30 26 H42 C46 26 49 29 49 33 C49 37 46 40 42 40 H36 L32 44 V40 H30 C28 40 27 38 27 36 V30 C27 28 28 26 30 26 Z" fill="#FCFAF6"/>
    <!-- 3 chat dots in gold -->
    <circle cx="34" cy="33" r="1.5" fill="#D6B36A"/>
    <circle cx="38" cy="33" r="1.5" fill="#D6B36A"/>
    <circle cx="42" cy="33" r="1.5" fill="#D6B36A"/>
    
    <!-- Golden flowing ribbon from D to H -->
    <path d="M48 37 C54 36 58 32 66 31 C72 30 76 33 80 34 L78 28 C74 27 70 25 64 26 C56 27 52 32 46 33 Z" fill="#D6B36A"/>
    
    <!-- H letter on the right -->
    <path d="M72 16 H84 V31 H94 V16 H106 V56 H94 V41 H84 V56 H72 Z" fill="#5A189A"/>
  </g>

  <!-- THEEYA'S Wordmark -->
  <text x="130" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="22" fill="#FFFFFF" letter-spacing="0.12em">THEEYA'S</text>
  
  <!-- DELUXE HUB with rule dashes -->
  <line x1="130" y1="52" x2="152" y2="52" stroke="#D6B36A" stroke-width="1.5"/>
  <text x="158" y="56" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="11" fill="#D6B36A" letter-spacing="0.28em">DELUXE HUB</text>
  <line x1="242" y1="52" x2="264" y2="52" stroke="#D6B36A" stroke-width="1.5"/>
</svg>
